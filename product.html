<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKY STORE - PRODUCTO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo" style="text-decoration: none;">SNEAKY STORE</a>
        <nav class="nav">
            <a href="index.html#productos" class="nav-link">SHOP</a>
            <a href="#" class="nav-link">NEW IN</a>
            <a href="https://www.instagram.com/sneakypeek.store/" class="nav-link" target="_blank" rel="noopener noreferrer">CONTACTO</a>
        </nav>
        <div class="header-icons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <!-- Carrito Icono -->
            <a href="#" id="cart-icon-btn" style="position: relative; color: inherit;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <div class="top-banner">
        ENVÍO GRATIS A PARTIR DE $120.000
    </div>

    <!-- Contenedor del Detalle de Producto -->
    <main class="product-page-main">
        <div id="loader" class="loader">Cargando producto...</div>
        <div id="pdp-container" class="pdp-container" style="display: none;">
            <!-- La info se inyecta por JS -->
            <div class="pdp-image-section">
                <button id="carousel-prev" class="carousel-arrow prev" style="display:none;">&#10094;</button>
                <img src="" id="pdp-main-image" alt="Producto">
                <iframe id="pdp-main-video" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="display:none; width:100%; height:100%;"></iframe>
                <button id="carousel-next" class="carousel-arrow next" style="display:none;">&#10095;</button>
            </div>
            
            <div class="pdp-info-section">
                <h1 id="pdp-title" class="pdp-title">Cargando...</h1>
                <div id="pdp-price" class="pdp-price">$0</div>
                
                <div class="pdp-option-group">
                    <label class="pdp-label">TALLE</label>
                    <div id="pdp-sizes" class="pdp-sizes">
                        <!-- Botones de talle inyectados por JS -->
                    </div>
                </div>

                <div class="pdp-option-group">
                    <label class="pdp-label">COLOR</label>
                    <div id="pdp-colors" class="pdp-colors">
                        <!-- Circulitos de colores inyectados por JS -->
                    </div>
                </div>
                
                <button id="pdp-add-btn" class="buy-btn" style="margin-top: 2rem;">AGREGAR AL CARRITO</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Sneaky Store. Todos los derechos reservados.</p>
    </footer>

    <!-- Estructura del Carrito Lateral (Offcanvas) -->
    <div id="cart-overlay" class="cart-overlay"></div>
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>TU CARRITO</h2>
            <button id="close-cart-btn" class="close-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Items inyectados por cart.js -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>TOTAL</span>
                <span id="cart-total-price">$0</span>
            </div>
            <button id="checkout-btn" class="buy-btn" style="width: 100%;">FINALIZAR COMPRA</button>
        </div>
    </div>

    <script src="cart.js"></script>
    <script src="app.js"></script>
</body>
</html>
